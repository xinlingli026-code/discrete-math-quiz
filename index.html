<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>离散数学自测 · 第 1 章 逻辑与证明</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="logo">∧∨¬</span>
    <div class="brand-txt">
      <h1>离散数学自测</h1>
      <p>The Foundations: Logic and Proofs · 第 1 章</p>
    </div>
  </div>
  <div class="top-actions">
    <div class="seg" id="modeSeg" role="tablist" aria-label="练习模式">
      <button class="seg-btn is-on" data-mode="seq">顺序练习</button>
      <button class="seg-btn" data-mode="random">随机组卷</button>
      <button class="seg-btn" data-mode="wrong">错题重练</button>
    </div>
    <button class="icon-btn" id="btnStats" title="学习统计">统计</button>
    <button class="icon-btn" id="btnCheat" title="考点速查卡">速查</button>
    <button class="icon-btn" id="btnTheme" title="切换深浅色">◐</button>
  </div>
</header>

<div class="layout">
  <!-- ============ 侧栏 ============ -->
  <aside class="sidebar" id="sidebar">
    <div class="side-block">
      <h3>小节</h3>
      <ul class="sec-list" id="secList"></ul>
    </div>

    <div class="side-block">
      <h3>题型筛选</h3>
      <div class="chips" id="typeChips"></div>
    </div>

    <div class="side-block">
      <h3>状态筛选</h3>
      <div class="chips" id="statusChips">
        <button class="chip is-on" data-status="all">全部</button>
        <button class="chip" data-status="todo">未做</button>
        <button class="chip" data-status="wrong">错题</button>
        <button class="chip" data-status="fav">收藏</button>
      </div>
    </div>

    <div class="side-block">
      <h3>进度</h3>
      <div class="prog-line"><span id="progText">—</span></div>
      <div class="bar"><i id="progBar"></i></div>
      <div class="mini-stats">
        <div><b id="stDone">0</b><span>已完成</span></div>
        <div><b id="stAcc">—</b><span>正确率</span></div>
        <div><b id="stFav">0</b><span>收藏</span></div>
      </div>
      <div class="side-btns">
        <button class="mini-btn" id="btnExport">导出进度</button>
        <button class="mini-btn" id="btnImport">导入进度</button>
        <button class="mini-btn danger" id="btnReset">重置进度</button>
      </div>
      <input type="file" id="fileImport" accept="application/json" hidden>
    </div>
  </aside>

  <!-- ============ 主区 ============ -->
  <main class="main">
    <!-- 组卷面板 -->
    <section class="panel" id="paperPanel" hidden>
      <h2>随机组卷</h2>
      <p class="muted">选择范围与题量，自动生成一份练习卷，可开启计时。</p>
      <div class="paper-grid">
        <label>题量
          <select id="pCount">
            <option>10</option><option selected>20</option><option>30</option><option>50</option>
          </select>
        </label>
        <label>小节
          <select id="pScope">
            <option value="all" selected>全部小节</option>
          </select>
        </label>
        <label class="ck"><input type="checkbox" id="pTimer" checked> 计时（到时自动交卷）</label>
      </div>
      <div class="paper-actions">
        <button class="btn primary" id="btnMakePaper">生成试卷</button>
        <button class="btn" id="btnShuffleAll">随机全部题序</button>
      </div>
    </section>

    <!-- 练习头部 -->
    <div class="run-head" id="runHead" hidden>
      <div class="rh-left">
        <span class="rh-title" id="rhTitle">顺序练习</span>
        <span class="rh-meta" id="rhMeta"></span>
      </div>
      <div class="rh-right">
        <span class="timer" id="timer" hidden>00:00</span>
        <button class="mini-btn" id="btnSearch">搜索题目</button>
      </div>
    </div>

    <!-- 题目容器 -->
    <section id="qWrap" class="q-wrap"></section>

    <div class="empty" id="emptyBox" hidden>
      <p>当前筛选条件下没有题目。</p>
      <button class="btn" id="btnResetFilter">清除筛选条件</button>
    </div>

    <!-- 底部导航 -->
    <nav class="navbar" id="navBar" hidden>
      <button class="btn" id="btnPrev">← 上一题</button>
      <div class="nav-dots" id="navDots"></div>
      <button class="btn primary" id="btnNext">下一题 →</button>
    </nav>
  </main>
</div>

<!-- ============ 统计弹层 ============ -->
<div class="modal" id="statsModal" hidden>
  <div class="modal-box wide">
    <button class="modal-x" data-close>×</button>
    <h2>学习统计</h2>
    <div class="stat-wrap" id="statWrap"></div>
  </div>
</div>

<!-- ============ 速查卡弹层 ============ -->
<div class="modal" id="cheatModal" hidden>
  <div class="modal-box wide">
    <button class="modal-x" data-close>×</button>
    <h2>考点速查卡</h2>
    <div class="cheat-wrap" id="cheatWrap"></div>
  </div>
</div>

<!-- ============ 搜索弹层 ============ -->
<div class="modal" id="searchModal" hidden>
  <div class="modal-box">
    <button class="modal-x" data-close>×</button>
    <h2>搜索题目</h2>
    <input class="search-input" id="searchInput" type="search" placeholder="输入关键词，例如：德摩根 / tautology / 量词" autocomplete="off">
    <div class="search-results" id="searchResults"></div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<!-- 题库数据（顺序加载，均为普通 script，双击即可离线使用） -->
<script>window.BANK = window.BANK || [];</script>
<script src="data/sec11.js"></script>
<script src="data/sec12.js"></script>
<script src="data/sec13.js"></script>
<script src="data/sec14.js"></script>
<script src="data/sec15a.js"></script>
<script src="data/sec15b.js"></script>
<script src="data/sec16.js"></script>
<script src="app.js"></script>
</body>
</html>
